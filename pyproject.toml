[tool.poetry]
name = "stt-gateway"
version = "0.1.0"
description = "Deepgram-compatible streaming speech-to-text WebSocket gateway backed by whisper.cpp and SeamlessM4T"
authors = ["plartemyev"]
license = "GPL-2.0-only"
readme = "README.md"
repository = "https://github.com/plartemyev/stt_gateway"
packages = [{ include = "stt_gateway" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
httpx = ">=0.27"
av = ">=14.0"
numpy = ">=2.0"
scipy = ">=1.14"
# Seamless engine runtime; torch cu13 wheels need NVIDIA driver >= 580.
torch = ">=2.9"
transformers = ">=4.44"
sentencepiece = ">=0.2"
protobuf = ">=5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
jiwer = ">=3.0"
datasets = ">=3.0"
soundfile = ">=0.12"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
